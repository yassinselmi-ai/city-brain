<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>City Brain | Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e17;
            --panel: #111827;
            --border: #1f2937;
            --text: #e5e7eb;
            --dim: #9ca3af;
            --neon: #00ff9d;
            --neon-blue: #00d2ff;
            --warn: #f59e0b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 157, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(31, 41, 55, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(31, 41, 55, 0.2) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        header {
            padding: 15px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .logo { font-family: 'Share Tech Mono', monospace; font-size: 1.5rem; color: var(--neon); text-shadow: 0 0 10px rgba(0, 255, 157, 0.5); display: flex; align-items: center; gap: 10px; }
        .status { font-family: 'Share Tech Mono', monospace; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 8px var(--neon); animation: pulse 2s infinite; }

        .kpi-container { display: flex; gap: 15px; padding: 20px 30px; }
        .kpi {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            position: relative;
            overflow: hidden;
        }
        .kpi::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--neon-blue); }
        .kpi-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
        .kpi-value { font-family: 'Share Tech Mono', monospace; font-size: 2rem; color: var(--text); margin-top: 5px; }
        .kpi-value.danger { color: var(--danger); }

        .main { display: flex; flex: 1; overflow: hidden; gap: 20px; padding: 0 30px 30px 30px; }
        
        .panel { background: rgba(17, 24, 39, 0.8); border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { padding: 12px 20px; background: rgba(31, 41, 55, 0.5); border-bottom: 1px solid var(--border); font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
        .timeline { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        
        .event { background: var(--panel); border-left: 3px solid var(--neon); padding: 12px 15px; border-radius: 4px; animation: slideIn 0.4s ease-out forwards; opacity: 0; transform: translateX(20px); }
        .event.verdict { border-left-color: var(--warn); }
        .event.dispatch { border-left-color: var(--neon-blue); box-shadow: inset 0 0 20px rgba(0, 210, 255, 0.05); }
        .event.discard { border-left-color: var(--danger); opacity: 0.8; }
        
        .ev-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .ev-type { font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; font-weight: bold; }
        .ev-time { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: var(--dim); }
        .ev-details { font-size: 0.85rem; color: var(--dim); }

        .side-panel { width: 300px; display: flex; flex-direction: column; gap: 20px; }
        .control-box { padding: 20px; }
        .control-title { font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; margin-bottom: 15px; color: var(--dim); }
        
        .btn { width: 100%; padding: 12px; background: transparent; color: var(--neon); border: 1px solid var(--neon); font-family: 'Share Tech Mono', monospace; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; border-radius: 4px; margin-bottom: 10px; }
        .btn:hover { background: var(--neon); color: var(--bg); box-shadow: 0 0 15px rgba(0, 255, 157, 0.4); }
        .btn.blue { color: var(--neon-blue); border-color: var(--neon-blue); }
        .btn.blue:hover { background: var(--neon-blue); color: var(--bg); box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }
        .btn.warn { color: var(--warn); border-color: var(--warn); }
        .btn.warn:hover { background: var(--warn); color: var(--bg); box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }

        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--dim); }

        /* RADAR ANIMATIONS */
        @keyframes sweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .blip {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: transparent;
            box-shadow: 0 0 0 0 transparent;
            transition: all 0.2s;
        }

        .blip.active {
            background: var(--danger);
            box-shadow: 0 0 10px 2px var(--danger);
            animation: blip-ping 1.5s ease-out infinite;
        }

        @keyframes blip-ping {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            CITY BRAIN <span style="color:var(--dim);font-size:1rem;">// OPS CENTER</span>
        </div>
        <button id="audio-btn" onclick="initAudio()" style="background:transparent; border:1px solid var(--warn); color:var(--warn); padding:8px 15px; cursor:pointer; font-family:'Share Tech Mono'; border-radius:4px;">
            🔊 ENABLE AUDIO
        </button>
        <div class="status">
            <div class="status-dot" id="sys-status"></div>
            <span id="sys-status-text">SYSTEM ONLINE</span>
        </div>
    </header>

    <div class="kpi-container">
        <div class="kpi"><div class="kpi-label">Readings Ingested</div><div class="kpi-value" id="kpi-readings">0</div></div>
        <div class="kpi"><div class="kpi-label">Incidents Detected</div><div class="kpi-value" id="kpi-incidents">0</div></div>
        <div class="kpi"><div class="kpi-label">Actions Dispatched</div><div class="kpi-value" id="kpi-dispatched" style="color:var(--neon-blue);">0</div></div>
        <div class="kpi"><div class="kpi-label">Threats Blocked</div><div class="kpi-value danger" id="kpi-rejected">0</div></div>
    </div>

    <div class="main">
        <div class="panel" style="flex: 1;">
            <div class="panel-header">
                <span>LIVE TELEMETRY STREAM</span>
                <span id="clock" style="color:var(--neon);">00:00:00</span>
            </div>
            <div class="timeline" id="timeline">
                <div style="text-align:center; color:var(--dim); margin-top:20px; font-family:'Share Tech Mono';">AWAITING TELEMETRY DATA...</div>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel control-box">
                <div class="control-title">SIMULATION CONTROLS</div>
                <button class="btn" onclick="simulate('fire')">🔥 Trigger Fire</button>
                <button class="btn" onclick="simulate('accident')">🚗 Trigger Accident</button>
                <button class="btn blue" onclick="simulate('traffic_jam')">🚦 Trigger Traffic Jam</button>
                <button class="btn blue" onclick="simulate('flood')">🌊 Trigger Flood</button>
            </div>
            
            <!-- TACTICAL RADAR -->
            <div class="panel" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
                <div class="panel-header" style="font-size:0.8rem;">
                    <span>TACTICAL RADAR</span>
                    <span style="color:var(--neon); animation: pulse 1.5s infinite;">● SCANNING</span>
                </div>
                <div style="flex:1; position:relative; background: #05080f; display:flex; justify-content:center; align-items:center; padding: 10px; overflow:hidden;">
                    
                    <!-- Radar Grid & Sweep -->
                    <div style="position:relative; width: 100%; aspect-ratio: 1; max-width: 250px; border-radius: 50%; border: 2px solid rgba(0, 255, 157, 0.3); box-shadow: 0 0 20px rgba(0, 255, 157, 0.1) inset;">
                        
                        <!-- Grid Lines -->
                        <div style="position:absolute; top:0; left:50%; width:1px; height:100%; background:rgba(0, 255, 157, 0.15);"></div>
                        <div style="position:absolute; top:50%; left:0; width:100%; height:1px; background:rgba(0, 255, 157, 0.15);"></div>
                        <div style="position:absolute; top:25%; left:25%; width:50%; height:50%; border-radius:50%; border:1px solid rgba(0, 255, 157, 0.15);"></div>
                        <div style="position:absolute; top:12.5%; left:12.5%; width:75%; height:75%; border-radius:50%; border:1px solid rgba(0, 255, 157, 0.15);"></div>
                        
                        <!-- Concentric Rings -->
                        <div style="position:absolute; top:15%; left:15%; width:70%; height:70%; border-radius:50%; border:1px dashed rgba(0, 255, 157, 0.2);"></div>
                        <div style="position:absolute; top:35%; left:35%; width:30%; height:30%; border-radius:50%; border:1px dashed rgba(0, 255, 157, 0.2);"></div>
                        
                        <!-- Radar Sweep with Afterglow -->
                        <div class="radar-sweep" style="position:absolute; top:0; left:0; width:100%; height:100%; border-radius:50%; background: conic-gradient(from 0deg, transparent 0deg, rgba(0, 255, 157, 0.4) 360deg); animation: sweep 4s linear infinite;"></div>
                        
                        <!-- Blips -->
                        <div id="blip-downtown" class="blip" style="top: 30%; left: 50%;"></div>
                        <div id="blip-north" class="blip" style="top: 20%; left: 30%;"></div>
                        <div id="blip-south" class="blip" style="top: 70%; left: 70%;"></div>
                        <div id="blip-harbor" class="blip" style="top: 50%; left: 80%;"></div>

                        <!-- Labels -->
                        <span style="position:absolute; top:5%; left:50%; transform:translateX(-50%); font-size:10px; color:rgba(0,255,157,0.6); font-family:'Share Tech Mono';">N</span>
                        <span style="position:absolute; bottom:5%; left:50%; transform:translateX(-50%); font-size:10px; color:rgba(0,255,157,0.6); font-family:'Share Tech Mono';">S</span>
                        <span style="position:absolute; top:50%; left:5%; transform:translateY(-50%); font-size:10px; color:rgba(0,255,157,0.6); font-family:'Share Tech Mono';">W</span>
                        <span style="position:absolute; top:50%; right:5%; transform:translateY(-50%); font-size:10px; color:rgba(0,255,157,0.6); font-family:'Share Tech Mono';">E</span>
                    </div>
                </div>
                <div style="font-family:'Share Tech Mono'; font-size:0.7rem; color:var(--dim); text-align:center; padding:5px; border-top:1px solid var(--border);">
                    TSYP14 // BRAIN v1.0
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CLOCK ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. AUDIO ENGINE ---
        let audioCtx = null;
        let isAudioEnabled = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isAudioEnabled = true;
            document.getElementById('audio-btn').style.display = 'none';
        }

        function playTone(freq, type, duration, vol=0.1) {
            if (!isAudioEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playReading() { playTone(800, 'sine', 0.1, 0.05); }
        function playVerdict() { playTone(1200, 'square', 0.05, 0.03); setTimeout(() => playTone(1400, 'square', 0.05, 0.03), 100); }
        function playDispatch() {
            if (!isAudioEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1500, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
        function playDiscard() { playTone(200, 'sawtooth', 0.3, 0.05); }

        // --- 3. RADAR BLIPS ---
        function blinkRadar(zone) {
            const blip = document.getElementById('blip-' + zone);
            if (!blip) return;
            
            // Add active class (shows red dot and pings)
            blip.classList.add('active');
            
            // Remove after 4 seconds
            setTimeout(() => {
                blip.classList.remove('active');
            }, 4000); 
        }

        // --- 4. DATA FETCHING & RENDERING ---
        let lastEventTs = 0;

        async function fetchData() {
            try {
                const resEvents = await fetch('/api/live-events', { cache: 'no-store' });
                const events = await resEvents.json();
                const timeline = document.getElementById('timeline');
                
                if (events && events.length > 0) {
                    // On récupère le timestamp du dernier événement connu
                    const newestTs = events[events.length - 1].ts;

                    // Si le timestamp est plus récent que le dernier qu'on a vu
                    if (newestTs > lastEventTs) {
                        
                        // On filtre les événements qui sont plus récents que lastEventTs
                        const newEvents = events.filter(ev => ev.ts > lastEventTs);
                        const now = Date.now();
                        let soundCount = 0;
                        
                        newEvents.forEach(ev => {
                            const age = now - (ev.ts * 1000);
                            if (age < 3000 && soundCount < 3) {
                                if (ev.type === "Reading Arrived") { playReading(); soundCount++; }
                                else if (ev.type === "Guardian Verdict") { playVerdict(); soundCount++; }
                                else if (ev.type === "Action Dispatched") {
                                    playDispatch(); soundCount++;
                                    const d = ev.details.toLowerCase();
                                    if (d.includes('downtown')) blinkRadar('downtown');
                                    if (d.includes('north')) blinkRadar('north');
                                    if (d.includes('south')) blinkRadar('south');
                                    if (d.includes('harbor')) blinkRadar('harbor');
                                }
                                else if (ev.type === "Incident Discarded" || ev.type === "Replay Rejected") { playDiscard(); soundCount++; }
                            }
                        });

                        // Re-render timeline
                        timeline.innerHTML = '';
                        events.slice().reverse().forEach(ev => {
                            const div = document.createElement('div');
                            div.className = 'event ' + (ev.class || '');
                            const time = new Date(ev.ts * 1000).toLocaleTimeString('en-GB');
                            
                            div.innerHTML = `
                                <div class="ev-header">
                                    <span class="ev-type">${ev.type}</span>
                                    <span class="ev-time">${time}</span>
                                </div>
                                <div class="ev-details">${ev.details}</div>
                            `;
                            timeline.appendChild(div);
                        });

                        // Mettre à jour le dernier timestamp vu
                        lastEventTs = newestTs;
                    }
                }

                const resMetrics = await fetch('/metrics', { cache: 'no-store' });
                const m = await resMetrics.json();
                
                document.getElementById('kpi-readings').innerText = m.readings_ingested_total;
                document.getElementById('kpi-incidents').innerText = m.incidents_detected_total;
                document.getElementById('kpi-dispatched').innerText = m.dispatches_total;
                document.getElementById('kpi-rejected').innerText = m.discards_total;

                const sysText = document.getElementById('sys-status-text');
                const sysDot = document.getElementById('sys-status');
                if (m.discards_by_reason && m.discards_by_reason['guardian_unreachable'] > 0) {
                    sysText.innerText = "DEGRADED (GUARDIAN OFFLINE)";
                    sysText.style.color = "var(--warn)";
                    sysDot.style.background = "var(--warn)";
                    sysDot.style.boxShadow = "0 0 8px var(--warn)";
                } else {
                    sysText.innerText = "SYSTEM ONLINE";
                    sysText.style.color = "var(--neon)";
                    sysDot.style.background = "var(--neon)";
                }

            } catch (e) {
                console.error("API Error", e);
            }
        }

        setInterval(fetchData, 1000);
        fetchData();

        // --- 5. SIMULATION TRIGGER ---
        async function simulate(type) {
            try {
                await fetch('/api/simulate?incident_type=' + type, { method: 'POST' });
            } catch (e) {
                alert("Failed to send simulation.");
            }
        }
    </script>
</body>
</html>
