services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://citybrain:citybrain@postgres:5432/citybrain
      REDIS_URL: redis://redis:6379/0
      TRUST_THRESHOLD: "0.7"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  consumer:
    build: .
    command: ["python", "scripts/run_consumer.py"]
    environment:
      DATABASE_URL: postgresql://citybrain:citybrain@postgres:5432/citybrain
      REDIS_URL: redis://redis:6379/0
      TRUST_THRESHOLD: "0.7"
      GUARDIAN_URL: http://api:8000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: on-failure:5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: citybrain
      POSTGRES_PASSWORD: citybrain
      POSTGRES_DB: citybrain
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citybrain"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata: